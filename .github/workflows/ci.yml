name: CI

on:
  push:
    # Not main: it only receives commits that already passed here on dev (D-075).
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Changes are recorded (CHANGELOG · README)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-docs.mjs origin/${{ github.base_ref }}

  app:
    name: Lint · typecheck · unit tests · web build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Edge Functions' copy of @wayfarer/shared is in sync
        run: node scripts/sync-shared.mjs --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build:web
      - name: Install Playwright Chromium
        run: pnpm --filter @wayfarer/mobile exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/mobile/playwright-report
          retention-days: 7

  database:
    name: Supabase migrations + pgTAP (RLS) tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # config.toml's Send Email Hook (D-066) needs a well-formed secret to load; this is the
      # local-only value from .env.example, not a production secret.
      SEND_EMAIL_HOOK_SECRET: v1,whsec_dHJhdmVsaXN0LWxvY2FsLW9ubHktaG9vay1zZWNyZXQ=
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
      - run: supabase db lint --schema public --level warning --fail-on error

  functions:
    name: Edge Functions (deno lint · fmt · test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
      - run: deno fmt --check
      - run: deno test --allow-net=jsr.io

  pipeline:
    name: Data pipeline (ruff · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the data gate compares with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m wayfarer_pipeline validate-config
      - name: docs/CITIES.md matches cities.yaml and the ingested data
        run: python -m wayfarer_pipeline cities-doc --check
      # Texts, photos and facts must not get worse, and no city may lose many places (D-042).
      # An intended big change (e.g. a city re-scoped) is merged with the `data-gate-override` label.
      - name: Data gate against the base branch
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'data-gate-override')
        run: python -m wayfarer_pipeline gate --base origin/${{ github.base_ref }}
