# Reference basket for the price estimates of a city (D-088).
#
# THESE NUMBERS ARE ASSUMPTIONS, not measurements: typical prices in USD of everyday things for a
# visitor in a United States city, where the national price level is 1.00. The estimate for a city
# is this basket scaled by its country's price level (World Bank: PPP conversion factor of
# household consumption divided by the exchange rate), converted to euros. The one real figure is
# McDonald's: the Big Mac price per country from The Economist's Big Mac index.
# Replace a value here when a better source exists; the estimates are regenerated by
# `python -m wayfarer_pipeline prices --all --refresh`.
reference: United States, price level 1.00
items_usd:
  beer: 7.0 # a 0.5 L domestic beer in a bar or restaurant
  soft_drink: 3.0 # a 0.33 L Coca-Cola in a restaurant
  cocktail: 13.0 # a cocktail in a bar
  coffee: 4.5 # a cappuccino
  meal_cheap: 17.0 # a meal at an inexpensive restaurant, one person
  meal_mid: 38.0 # a three-course meal at a mid-range restaurant, one person
  local_dish: 22.0 # a typical local dish in an ordinary restaurant
  transport_ticket: 2.5 # a one-way ticket on local public transport
  taxi_5km: 16.0 # a taxi or ride-hailing trip of about 5 km
# Countries that use the euro and so share the euro-area Big Mac price of the index ("EUZ").
euro_area: [AT, BE, CY, DE, EE, ES, FI, FR, GR, HR, IE, IT, LT, LU, LV, MT, NL, PT, SI, SK]
# A country with no price level of its own is estimated like a neighbour that has one.
proxies:
  AD: ES
  MC: FR
