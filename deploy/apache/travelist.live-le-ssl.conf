<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName travelist.live
    ServerAlias www.travelist.live
    DocumentRoot /var/www/travelist

    <Directory /var/www/travelist>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Static export: /sign-in -> sign-in.html; dynamic routes -> their [param].html page.
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
    RewriteRule ^ - [L]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.html -f
    RewriteRule ^(.+?)/?$ $1.html [L]
    RewriteRule ^/city/[^/]+/?$ "/city/[slug].html" [L]
    RewriteRule ^/short/[^/]+/(meetups|walklists)/?$ "/short/[slug]/$1.html" [L]
    RewriteRule ^/short/[^/]+/?$ "/short/[slug].html" [L]
    RewriteRule ^/attraction/[^/]+/?$ "/attraction/[id].html" [L]
    RewriteRule ^/checklist/[^/]+/?$ "/checklist/[city].html" [L]
    RewriteRule ^/trip/[^/]+/?$ "/trip/[id].html" [L]
    ErrorDocument 404 /+not-found.html

    # Hashed JS/CSS never change; HTML is always revalidated.
    <LocationMatch "^/_expo/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/travelist-error.log
    CustomLog ${APACHE_LOG_DIR}/travelist-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/travelist.live/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/travelist.live/privkey.pem
</VirtualHost>
</IfModule>
